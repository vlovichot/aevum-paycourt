name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        run: cd contracts && forge build --sizes
      - name: Shanghai opcode check
        run: node tools/check-shanghai.mjs contracts/out
      - name: Unit tests
        run: cd contracts && forge test --no-match-path 'test/fork/*' -vv
      - name: Fork tests (real tUSD8 on Aevum)
        # Uses the public RPC; skip with a failing network rather than block the PR.
        continue-on-error: true
        run: cd contracts && forge test --match-path 'test/fork/*' --fork-url https://rpc-test.qday.info -vv

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm build
